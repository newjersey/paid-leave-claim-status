name: Deploy Prod to Beta

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the prod branch
      uses: actions/checkout@v3
      with:
        ref: prod

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Checkout beta repo
      uses: actions/checkout@v3
      with:
        repository: newjersey/beta
        token: ${{ secrets.GITHUB_TOKEN }}
        path: beta
        ref: master

    - name: Run prep-deploy-prod
      run: npm run prep-deploy-prod

    - name: Commit and push changes to beta repo
      run: |
        cd beta
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        latest_commit=$(git --git-dir=../.git rev-parse prod)
        git add .
        git commit -m "TDI prod. Latest commit: $latest_commit" || echo "No changes to commit"
        git push origin master
