name: Deploy to Beta

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Choose the environment to deploy'
        required: true
        default: 'dev'
        options:
          - prod
          - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@3
      with:
        app-id: "2454947"
        private-key: ${{ secrets.OOI_PULL_REQUEST_APP }}
        owner: newjersey
        repositories: |
          beta

    - name: Checkout the correct branch
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.environment }}
        token: ${{ steps.generate-token.outputs.token }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Checkout beta repo
      uses: actions/checkout@v6
      with:
        repository: newjersey/beta
        token: ${{ steps.generate-token.outputs.token }}
        path: beta
        ref: master

    - name: Run prep-deploy script based on environment
      run: npm run prep-deploy-${{ inputs.environment }}

    - name: Create PR in beta repo
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        cd beta
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        latest_commit=$(git --git-dir=../.git rev-parse ${{ inputs.environment }})
        latest_commit_url="https://github.com/newjersey/paid-leave-claim-status/commit/${latest_commit}"
        
        branch_name="tdi-${{ inputs.environment }}-${GITHUB_RUN_ID}"
        git checkout -b $branch_name
        
        git add .
        if git commit -m "TDI ${{ inputs.environment }}. Latest commit: $latest_commit_url"; then
          git push origin $branch_name
          
          gh pr create \
            --repo newjersey/beta \
            --title "Deploy TDI ${{ inputs.environment }}" \
            --body "Automated deployment for TDI ${{ inputs.environment }} environment. Latest commit: $latest_commit_url" \
            --base master \
            --head $branch_name
        else
          echo "No changes to commit, skipping PR creation"
        fi
