name: Deploy to Beta (Testing in PR)

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Choose the environment to deploy'
        required: true
        default: 'dev'
        options:
          - prod
          - dev
      test_mode:
        type: boolean
        description: 'Run in test mode (creates PR to test branch)'
        required: false
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
    inputs:
      environment:
        default: 'dev'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: "2454947"
        private-key: ${{ secrets.OOI_PULL_REQUEST_APP }}

    - name: Checkout the correct branch
      uses: actions/checkout@v3
      with:
        ref: ${{ inputs.environment }}
        token: ${{ steps.generate-token.outputs.token }}

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Checkout beta repo
      uses: actions/checkout@v3
      with:
        repository: newjersey/beta
        token: ${{ secrets.BETA_REPO_TOKEN }}
        path: beta
        ref: master

    - name: Run prep-deploy script based on environment
      run: npm run prep-deploy-${{ inputs.environment }}

    - name: Commit and push changes to beta repo
      id: commit-push
      run: |
        cd beta
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        latest_commit=$(git --git-dir=../.git rev-parse ${{ inputs.environment }})

        # Add test indicator if in test mode
        test_indicator=""
        if [[ "${{ inputs.test_mode }}" == "true" ]]; then
          test_indicator="-test"
          echo "Running in test mode"
        fi

        # Create a new branch with timestamp
        branch_name="tdi-${{ inputs.environment }}${test_indicator}-$(date +%Y%m%d%H%M%S)"
        git checkout -b $branch_name
        git add .
        if git commit -m "TDI ${{ inputs.environment }}${test_indicator}. Latest commit: $latest_commit"; then
          has_changes="true"
          git remote set-url origin https://x-access-token:${{ secrets.BETA_REPO_TOKEN }}@github.com/newjersey/beta.git
          git push origin $branch_name

          # Store branch name for later use
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "test_mode=${{ inputs.test_mode }}" >> $GITHUB_OUTPUT
        else
          echo "No changes to commit"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.commit-push.outputs.has_changes == 'true'
      run: |
        cd beta
        gh auth login --with-token <<< "${{ secrets.BETA_REPO_TOKEN }}"

        # Set base branch based on test_mode
        base_branch="master"
        title_prefix="TDI ${{ inputs.environment }} update"
        body_prefix="Automated PR for TDI ${{ inputs.environment }} environment update"

        if [[ "${{ inputs.test_mode }}" == "true" ]]; then
          # For testing, use master branch but mark PR clearly as test
          echo "Creating test PR for testing purposes"
          title_prefix="[TEST PR] $title_prefix"
          body_prefix="TEST ONLY - DO NOT MERGE - $body_prefix"
        fi

        gh pr create \
          --repo newjersey/beta \
          --title "$title_prefix $(date +%Y-%m-%d)" \
          --body "$body_prefix. Created from workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --base $base_branch \
          --head ${{ steps.commit-push.outputs.branch_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.BETA_REPO_TOKEN }}

    - name: No changes detected
      if: steps.commit-push.outputs.has_changes != 'true'
      run: echo "No changes detected in the beta repository. Skipping PR creation."
