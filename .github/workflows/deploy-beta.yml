name: Deploy to Beta

on:
  # Allow manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Choose the environment to deploy'
        required: true
        default: 'dev'
        options:
          - prod
          - dev

  # Also run on pull requests
  pull_request:
    types: [opened, synchronize]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: "2454947"
        private-key: ${{ secrets.OOI_PULL_REQUEST_APP }}

    - name: Checkout the correct branch
      uses: actions/checkout@v3
      with:
        # For workflow_dispatch use input.environment, for PR use GITHUB_REF
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.head_ref }}

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Checkout beta repo
      uses: actions/checkout@v3
      with:
        repository: newjersey/beta
        token: ${{ steps.generate-token.outputs.token }}
        path: beta
        ref: master

    - name: Set environment variable
      id: set-env
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "deploy_env=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          echo "Using manually selected environment: ${{ inputs.environment }}"
        else
          # For PR, always use dev environment
          echo "deploy_env=dev" >> $GITHUB_OUTPUT
          echo "Running in PR #${{ github.event.pull_request.number }} - using dev environment"
          echo "PR Branch: ${{ github.head_ref }}"
        fi

    - name: Run prep-deploy script based on environment
      run: npm run prep-deploy-${{ steps.set-env.outputs.deploy_env }}

    - name: Commit and push changes to beta repo
      id: commit-push
      run: |
        cd beta
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        # Get current commit
        latest_commit=$(git --git-dir=../.git rev-parse HEAD)

        # Add PR number to branch name if this is a PR
        pr_suffix=""
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          pr_suffix="-pr${{ github.event.pull_request.number }}"
        fi

        # Create a new branch with timestamp and PR number if applicable
        branch_name="tdi-${{ steps.set-env.outputs.deploy_env }}${pr_suffix}-$(date +%Y%m%d%H%M%S)"
        git checkout -b $branch_name
        git add .
        if git commit -m "TDI ${{ steps.set-env.outputs.deploy_env }}. Latest commit: $latest_commit"; then
          has_changes="true"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/newjersey/beta.git
          git push origin $branch_name

          # Store branch name for later use
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "No changes to commit"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.commit-push.outputs.has_changes == 'true'
      run: |
        cd beta
        gh auth login --with-token <<< "${{ steps.generate-token.outputs.token }}"

        # Add PR info to title and body if this is from a PR
        title_prefix="TDI ${{ steps.set-env.outputs.deploy_env }}"
        body_prefix="Automated PR for TDI ${{ steps.set-env.outputs.deploy_env }} environment update"

        if [ "${{ github.event_name }}" == "pull_request" ]; then
          title_prefix="[PR #${{ github.event.pull_request.number }}] $title_prefix"
          body_prefix="$body_prefix from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
        fi

        gh pr create \
          --repo newjersey/beta \
          --title "$title_prefix update $(date +%Y-%m-%d)" \
          --body "$body_prefix. Created from workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --base master \
          --head ${{ steps.commit-push.outputs.branch_name }}
      env:
        GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

    - name: No changes detected
      if: steps.commit-push.outputs.has_changes != 'true'
      run: echo "No changes detected in the beta repository. Skipping PR creation."
